<head>
  <title>gs2009 Single Sign On</title>
  <link href="/__gs2009_wallma_/login.css" rel="stylesheet" />
  <script type="text/javascript" src="/__gs2009_wallma_/corploginscript.js"></script>
  <script type="text/javascript">
    otpParam = "otp";
    useOtp = 0;
  </script>
</head>

<body bgcolor="#ffffff" vlink="#666666" onload="loginOnload()">
  <table width="95%" border="0" align="center" cellpadding="0" cellspacing="0">
    <tr valign="top">
      <td width="1%"><img src="/__gs2009_wallma_/gs2009_wallma.png" border="0" align="left" vspace="13"
          alt="wallma - inside gs2009" /></td>
      <td width="99%" bgcolor="#ffffff" valign="top">
        <table width="100%" cellpadding="1">
          <tr valign="bottom">
            <td>
              <div align="right">&nbsp;</div>
            </td>
          </tr>
          <tr>
            <td nowrap="nowrap">
              <table width="100%" align="center" cellpadding="0" cellspacing="0" bgcolor="#C3D9FF"
                style="margin-bottom:5">
                <tr>
                  <td class="bubble tl"><img src="/__gs2009_wallma_/tl.gif" alt="" /></td>
                  <th class="bubble" rowspan="2">Single Sign On</th>
                  <td class="bubble tr"><img src="/__gs2009_wallma_/tr.gif" alt="" /></td>
                </tr>
                <tr>
                  <td class="bubble bl"><img src="/__gs2009_wallma_/bl.gif" alt="" /></td>
                  <td class="bubble br"><img src="/__gs2009_wallma_/br.gif" alt="" /></td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
  <br />
  <form method="post" id="loginForm" name="loginForm" onsubmit="return signInOnSubmit();"
    action="/__gs2009_wallma_/LoginAuth"><input type="hidden" id="ssoformat" name="ssoformat" value="CORP_SSO" />
    <script type="text/javascript">
      document.getElementById('mi').value = riskMi12()
    </script>
    <table width="1" align="center" cellpadding="5" cellspacing="1" class="signin">
      <tr>
        <td valign="top" align="center" colspan="2" class="bubble"><b>Many internal apps.&nbsp;&nbsp;One login page.</b>
        </td>
      </tr>
      <tr>
        <td width="25%" valign="top" style="padding-top: .5em; padding-right: 2em;">
          <table cellpadding="5" width="100%" border="0">
            <tr>
              <td colspan="2" style="text-align:center" nowrap="nowrap">
                <div class="caption">Use your LDAP username and password</div>
              </td>
            </tr>

            <tr>
              <td nowrap="nowrap">
                <div align="right">
                  <font size="-1" face="Arial, sans-serif"><label for="username">Username:</label></font>
                </div>
              </td>
              <td nowrap="nowrap"><input type="text" name="u" tabindex="1" size="15" id="username" value="" />
                <span style="font-size: 83%; position: relative; bottom: 2px;"><span
                    style="padding: 0 3px 0 5px;">@</span>
                  google.com
                  <a href="javascript:toggleInput('roleToggle', 'roleRow', 'role', 2)" id="roleToggle"
                    style="color:black; text-decoration: none">[+]</a></span>
              </td>
            </tr>
            <tr id="roleRow" style="display: none;">
              <td nowrap="nowrap">
                <div align="right">
                  <font size="-1" face="Arial, sans-serif"><label for="role">Role:</label></font>
                </div>
              </td>
              <td nowrap="nowrap"><input type="text" name="role" size="15" id="role" />
                <font size="-1">&nbsp;</font>
              </td>
            </tr>
            <tr>
              <td nowrap="nowrap">
                <div align="right">
                  <font size="-1"><label for="password">Password:</label></font>
                </div>
              </td>
              <td nowrap="nowrap"><input type="password" name="pw" tabindex="3" size="15" autocomplete="off"
                  id="password" />
                </td>
            </tr>
            <div class="errormsg">The username or password you entered is incorrect.</div>
            <tr>
              <td nowrap="nowrap">
                <div align="right"><input type="checkbox" name="rememberUser" id="rememberUser" checked="checked" />
                </div>
              </td>
              <td>
                <font size="-1"><label for="rememberUser">Remember my username</label></font>
              </td>
            </tr>
            <tr>
              <td nowrap="nowrap">
                <div align="right"><input type="checkbox" name="showImage" id="showImage" checked="checked" /></div>
              </td>
              <td>
                <font size="-1" face="Arial, sans-serif"><label for="showImage">Show Images</label></font>
              </td>
            </tr>

            <tr>
              <td colspan="2" align="center"><input type="submit" name="signInButton" id="signInButton" value="Sign in"
                  style="padding: 2px;" tabindex="4" /></td>
            </tr>
            <td colspan="2" align="center"></td>
          </table>
        </td>
        <td class="image-cell">
          <div id="corplogin-image"><img class="login-image" src="/__gs2009_wallma_/smiley.png" width="400" height="266"
              alt="decorative image" /></div>
        </td>
      </tr>
    </table>
  </form>
  <table width="95%" border="0" align="center" cellpadding="0" cellspacing="0" class="footer">
    <tr valign="top">
      <td width="99%" bgcolor="#ffffff" valign="top">
        <table width="100%" cellpadding="1">
          <tr valign="bottom">
            <td>
              <div align="right">&nbsp;</div>
            </td>
          </tr>
          <tr>
            <td nowrap="nowrap">
              <table width="100%" align="center" cellpadding="0" cellspacing="0" bgcolor="#C3D9FF"
                style="margin-bottom:5">
                <tr>
                  <td class="bubble tl"><img src="/__gs2009_wallma_/tl.gif" alt="" /></td>
                  <th class="bubble" rowspan="2"><span>&nbsp;</span></th>
                  <td class="bubble tr"><img src="/__gs2009_wallma_/tr.gif" alt="" /></td>
                </tr>
                <tr>
                  <td class="bubble bl"><img src="/__gs2009_wallma_/bl.gif" alt="" /></td>
                  <td class="bubble br"><img src="/__gs2009_wallma_/br.gif" alt="" /></td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
      <td width="1%"><a href="/?ssoformat=CORP_SSO&amp;ck=&amp;rpMode=v1_v2accepted"
          onclick="return setGnubbyCookie()"><img src="/__gs2009_wallma_/balls.gif" border="0" alt="" align="left"
            vspace="13" /></a></td>
    </tr>
  </table>
</body>
